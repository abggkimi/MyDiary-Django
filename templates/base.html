{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}|My日記</title>
    <link rel="icon" href="{% static 'images/mydiary-icon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <div class="page">
      <header class="site-header">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="navbar-collapse nav-menu" id="navbarSupportedContent">
                  <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="container-fluid">
                      <a class="navbar-brand" href="{% url 'index' %}">
                        <img src="{% static 'images/mydiary-icon.png' %}" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                        My日記
                      </a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'diary-list' %}">My日記一覧</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="{% url 'diary-create' %}">新規日記作成</a>
                  </li>
                  <!-- <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                    </a> -->
                    <!-- <ul class="dropdown-menu">
                      <li><a class="dropdown-item" href="#"></a></li>
                      <li><a class="dropdown-item" href="#"></a></li>
                      <li><hr class="dropdown-divider"></li>
                      <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                  </li> -->
                  <!-- <li class="nav-item">
                    <a class="nav-link disabled">Disabled</a>
                  </li>
                </ul> -->
                {% if request.user.is_authenticated %}
                <form action="{% url 'accounts:logout' %}" method="post" class="nav-logout">
                  {% csrf_token %}
                  <button method="post" class="btn btn-outline-success btn-sm" type="submit" href="{% url 'accounts:logout' %}">ログアウト</button>
                </form>
                {% else %}
                <a class="nav-link" href="{% url 'accounts:signup' %}">アカウント登録</a>
                <a class="nav-link" href="{% url 'accounts:login' %}">ログイン</a>
                {% endif %}
                {% if request.user.is_authenticated %}
                <form class="d-flex search-form" role="search" action="{% url 'diary-list' %}" method="get">
                  <input class="form-control me-2" type="search" name="q" placeholder="検索" aria-label="検索" value="{{ request.GET.q|default_if_none:'' }}">
                  <button class="btn btn-outline-success btn-sm" type="submit">検索</button>
                </form>
                {% endif %}
              </div>
            </div>
          </nav>
        </header>
        <main class="site-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    </body>
</html>
